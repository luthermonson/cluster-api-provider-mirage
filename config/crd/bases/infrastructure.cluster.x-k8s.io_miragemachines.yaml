---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  labels:
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: miragemachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: MirageMachine
    listKind: MirageMachineList
    plural: miragemachines
    singular: miragemachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.initialization.provisioned
      name: Ready
      type: string
    - jsonPath: .spec.providerID
      name: ProviderID
      type: string
    - jsonPath: .status.nodeName
      name: Node
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MirageMachine is a fake Cluster API infrastructure machine (a
          simulated VM).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MirageMachineSpec defines the desired state of a fake machine
              ("VM").
            properties:
              failureDomain:
                description: failureDomain is where this machine was (fake) placed.
                type: string
              nodeCPU:
                description: |-
                  nodeCPU, nodeMemory and nodePods set the capacity/allocatable the fake
                  Node advertises. Defaults are applied when empty. These allow the real
                  kube-scheduler to bind pending pods to Mirage nodes (autoscaler demo).
                type: string
              nodeLabels:
                additionalProperties:
                  type: string
                description: |-
                  nodeLabels are extra labels placed on the fake Node (e.g. to satisfy a
                  workload's nodeSelector).
                type: object
              nodeMemory:
                type: string
              nodePods:
                type: string
              providerID:
                description: |-
                  providerID is set by the controller once the fake VM is provisioned. The
                  Cluster API Machine controller copies it onto the owning Machine and uses
                  it to match the fake Node.
                type: string
              schedulable:
                description: |-
                  schedulable, when true, omits the Mirage NoSchedule taint so real pods
                  can be scheduled onto the fake Node. Worker machines used by the
                  autoscaler demo keep the default (tainted) and the demo pods tolerate it.
                type: boolean
            type: object
          status:
            description: MirageMachineStatus defines the observed state of a MirageMachine.
            properties:
              addresses:
                description: addresses are the fake machine addresses.
                items:
                  description: MachineAddress is a fake address reported for a MirageMachine.
                  properties:
                    address:
                      description: address is the value.
                      type: string
                    type:
                      description: type is one of Hostname, ExternalIP, InternalIP,
                        ExternalDNS, InternalDNS.
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: conditions is the standard Cluster API v1beta2 condition
                  set.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              deletionStartedAt:
                description: deletionStartedAt records when the fake deprovision timer
                  started.
                format: date-time
                type: string
              initialization:
                description: initialization reports the Cluster API contract provisioning
                  signal.
                properties:
                  provisioned:
                    description: |-
                      provisioned is true when the fake infrastructure has finished
                      provisioning. This is the v1beta2 Cluster API contract field.
                    type: boolean
                type: object
              nodeName:
                description: nodeName is the fake Node registered for this machine.
                type: string
              nodeRegisterStartedAt:
                description: |-
                  nodeRegisterStartedAt records when the fake Node-registration timer
                  started (after the fake VM is provisioned, before the Node appears).
                format: date-time
                type: string
              phase:
                description: |-
                  phase is the fake lifecycle phase: Pending, Provisioning, Provisioned,
                  Deleting.
                type: string
              provisioningStartedAt:
                description: provisioningStartedAt records when the fake VM-create
                  timer started.
                format: date-time
                type: string
              ready:
                description: ready mirrors initialization.provisioned.
                type: boolean
              targetNodeSeconds:
                description: targetNodeSeconds is the randomized Node-registration
                  duration.
                format: int64
                type: integer
              targetProvisioningSeconds:
                description: targetProvisioningSeconds is the randomized VM-create
                  duration.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
