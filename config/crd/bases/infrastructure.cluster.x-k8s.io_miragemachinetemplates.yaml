kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  labels:
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: miragemachinetemplates.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: MirageMachineTemplate
    listKind: MirageMachineTemplateList
    plural: miragemachinetemplates
    singular: miragemachinetemplate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MirageMachineTemplate is a template for MirageMachines.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MirageMachineTemplateSpec defines a MirageMachine template.
            properties:
              template:
                description: MirageMachineTemplateResource is the templated MirageMachine.
                properties:
                  metadata:
                    type: object
                  spec:
                    description: MirageMachineSpec defines the desired state of a
                      fake machine ("VM").
                    properties:
                      failureDomain:
                        description: failureDomain is where this machine was (fake)
                          placed.
                        type: string
                      nodeCPU:
                        description: |-
                          nodeCPU, nodeMemory and nodePods set the capacity/allocatable the fake
                          Node advertises. Defaults are applied when empty. These allow the real
                          kube-scheduler to bind pending pods to Mirage nodes (autoscaler demo).
                        type: string
                      nodeLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          nodeLabels are extra labels placed on the fake Node (e.g. to satisfy a
                          workload's nodeSelector).
                        type: object
                      nodeMemory:
                        type: string
                      nodePods:
                        type: string
                      providerID:
                        description: |-
                          providerID is set by the controller once the fake VM is provisioned. The
                          Cluster API Machine controller copies it onto the owning Machine and uses
                          it to match the fake Node.
                        type: string
                      schedulable:
                        description: |-
                          schedulable, when true, omits the Mirage NoSchedule taint so real pods
                          can be scheduled onto the fake Node. Worker machines used by the
                          autoscaler demo keep the default (tainted) and the demo pods tolerate it.
                        type: boolean
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
        type: object
    served: true
    storage: true
