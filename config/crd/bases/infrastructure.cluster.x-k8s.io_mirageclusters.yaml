                format: date-time
                type: string
              ready:
                description: ready is a human-friendly mirror of initialization.provisioned.
                type: boolean
              targetProvisioningSeconds:
                description: |-
                  targetProvisioningSeconds is the randomized duration chosen for this
                  object's fake provisioning. The object stays Provisioning until this
                  many seconds have elapsed since provisioningStartedAt.
                format: int64
                type: integer
            type: object
