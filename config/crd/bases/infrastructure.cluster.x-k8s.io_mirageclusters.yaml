    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MirageCluster is a fake Cluster API infrastructure cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MirageClusterSpec defines the desired state of a fake infrastructure
              cluster.
            properties:
              controlPlaneEndpoint:
                description: |-
                  controlPlaneEndpoint is the endpoint used to contact the (fake) control
                  plane. If left empty, the MirageCluster controller fabricates one.
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    type: integer
