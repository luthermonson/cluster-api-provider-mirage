apiVersion: v1
kind: Namespace
metadata:
  name: system
  labels:
    cluster.x-k8s.io/provider: infrastructure-mirage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirage-controller-manager
  namespace: system
  labels:
    cluster.x-k8s.io/provider: infrastructure-mirage
    control-plane: mirage-controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: mirage-controller-manager
  template:
    metadata:
      labels:
        cluster.x-k8s.io/provider: infrastructure-mirage
        control-plane: mirage-controller-manager
    spec:
      serviceAccountName: mirage-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: controller:latest
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect
        - --timing-profile=fast
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8080
        env:
        - name: MIRAGE_WORKLOAD_TOKEN_SECRET
          value: mirage-system/mirage-workload-token
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      terminationGracePeriodSeconds: 10
